<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>IM3029</title>
    <style>
        table {
            border-collapse: collapse; 
            width: 300px;
        }

        table, th, td {
            border: 1px solid black;
            text-align: left;
            padding: 8px;
        }

        th {
            background-color: #666666;
            color: white;
        }

        .yellow-row {
            background-color: yellow;
        }

        .fixed-box {
            position: fixed;  
            top: 20px;         
            right: 20px;     
            
            width: 150px;
            height: 100px;
            border: 2px solid #7eb11c; 
            padding: 10px;
            font-size: 14px;
            background-color: white; 
        }
    </style>
</head>
<body>

    <table>
        <thead>
            <tr>
                <th>Firstname</th>
                <th>Lastname</th>
            </tr>
        </thead>
        <tbody>
            <tr class="yellow-row">
                <td>1</td>
                <td>1</td>
            </tr>
            <tr>
                <td>2</td>
                <td>2</td>
            </tr>
            <tr class="yellow-row">
                <td>3</td>
                <td>3</td>
            </tr>
        </tbody>
    </table>

    <div class="fixed-box">
        This div element has position: fixed;
    </div>

</body>
</html>
