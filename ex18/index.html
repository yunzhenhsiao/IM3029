<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IM3029</title>
    <style>
    .h1-style {
        font-family: serif;
        border-top: 2px solid black;
        text-shadow: 2px 2px pink; 
        display: inline-block; 
    }

    .h2-style {
        font-family: serif;
        font-style: italic;
        outline: 5px solid yellow; 
        border: 1px solid black;
        padding: 2px;
    }

    .h3-style {
        font-family: serif;
        text-align: right;      
        text-decoration: underline;
    }
    </style>
</head>
<body>
    <h1 class="h1-style">This is heading 1</h1>
    <h2 class="h2-style">This is heading 2</h2>
    <h3 class="h3-style">This is heading 3</h3>
</body>
</html>
