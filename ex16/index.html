<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IM3029</title>
    <style>
        .box {
        margin-bottom: 10px;
        padding: 10px;
        width: 300px;
        font-family: serif;
        font-weight: bold;
    }

    .double-border {
        background-color: lightblue;
        border: 5px double tomato; 
    }

    .solid-border {
        background-color: yellow;
        border: 3px solid blue;     
        border-radius: 10px;      
    }

    .dotted-border {
        background-color: mediumseagreen;
        border: 5px dotted gray;  
    }
    </style>
</head>
<body>
    <div class="box double-border">Hello World</div>
    <div class="box solid-border">Hello World</div>
    <div class="box dotted-border">Hello World</div>
</body>
</html>
